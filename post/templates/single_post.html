{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>{{ post.title }} | Posts</title>
</head>

<body class="posts-page">
    <main class="page create-shell">
        <a class="text-link" href="{% url 'all_posts' %}">Back to all posts</a>

        <article class="single-post">
            <p class="post-index">Post</p>
            <h1>{{ post.title }}</h1>
            {% if post.image %}
            <img src="{{ post.image.url }}" alt="{{ post.title }}" class="post-image">
            {% endif %}
            <p class="post-content">{{ post.content }}</p>
            <div class="post-actions">
                <a href="{% url 'edit_post' post.id %}"><button class="post-action" type="button"
                        aria-label="Edit post">
                        <i class="fa fa-pencil" aria-hidden="true"></i>
                    </button></a>
                <a href="{% url 'delete_post' post.id %}"><button class="post-action" type="button"
                        aria-label="Delete post">
                        <i class="fa fa-trash" aria-hidden="true"></i>
                    </button></a>
                <a href="{% url 'like_post' post.id %}"><button class="post-action" type="button"
                        aria-label="Like post">
                        <i class="fa fa-heart" aria-hidden="true"></i>
                    </button></a>
                <p>{{ post_like.likes.count }} Likes</p>
            </div>
        </article>

        <a class="primary-button" href="{% url 'create_posts' %}">Create post</a>
    </main>
</body>

</html>
